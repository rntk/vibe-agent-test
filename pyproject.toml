[tool.poetry]
name = "cagent"
version = "0.1.0"
description = "A Python CLI application"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "cagent" }]

[tool.poetry.dependencies]
python = "^3.12"
anthropic = "^0.96.0"
openai = "^2.32.0"
google-genai = "^1.73.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.4"

[tool.poetry.scripts]
cagent = "cagent.main:main"

# ---------------------------------------------------------------------------
# Ruff – linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["cagent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=cagent --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["cagent"]
omit = ["tests/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
